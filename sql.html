<body>

<div id="site-header"></div>
<span id="top"></span>

<main class="convert-shell">
  <div class="convert-head">
    <div class="container tool-topbar">
      <h1>JSON to SQL</h1>
      <p class="tt-sub">CREATE TABLE and INSERT statements for Postgres, MySQL, SQL Server or SQLite.</p>
    </div>
    <div class="container">
      <div class="opt-bar">
        <div class="opt">
          <label for="opt-dialect">Dialect</label>
          <select id="opt-dialect">
            <option value="postgres" selected>PostgreSQL</option>
            <option value="mysql">MySQL</option>
            <option value="mssql">SQL Server</option>
            <option value="sqlite">SQLite</option>
          </select>
        </div>
        <div class="opt">
          <label for="opt-table">Table</label>
          <input type="text" id="opt-table" value="my_table" style="min-width:120px;">
        </div>
        <div class="opt-sep"></div>
        <div class="opt">
          <input type="checkbox" id="opt-create" checked>
          <label for="opt-create" style="cursor:pointer;">CREATE TABLE</label>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-multi" checked>
          <label for="opt-multi" style="cursor:pointer;">Multi-row INSERT</label>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-snake" checked>
          <label for="opt-snake" style="cursor:pointer;">snake_case columns</label>
        </div>
      </div>
    </div>
  </div>
  <div class="convert-grid">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">JSON array</div>
        <button id="btn-sample">Load sample</button>
        <button id="btn-upload">Upload</button>
        <button id="btn-clear">Clear</button>
        <input type="file" id="file-input" accept=".json,application/json" style="display:none;">
      </div>
      <div class="pane-body">
        <textarea id="input" class="code-area" spellcheck="false" placeholder="[{"id": 1, "name": "Ada"}]"></textarea>
      </div>
      <div class="pane-status" id="in-status">Waiting for input.</div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">SQL</div>
        <button class="primary" id="btn-run">Generate</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
      <div class="pane-body">
        <textarea id="output" class="code-area" spellcheck="false" readonly placeholder="Generated SQL appears here."></textarea>
        <p class="note">Values are inlined as literals with quotes escaped — fine for seeding and fixtures, but use parameterised queries for anything driven by untrusted input.</p>
      </div>
      <div class="pane-status" id="out-status"></div>
    </section>
  </div>
</main>
