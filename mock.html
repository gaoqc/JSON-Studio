<body>

<div id="site-header"></div>
<span id="top"></span>

<main class="convert-shell">
  <div class="convert-head">
    <div class="container tool-topbar">
      <h1>Mock data generator</h1>
      <p class="tt-sub">Turn a JSON Schema into realistic, seeded sample records.</p>
    </div>
    <div class="container">
      <div class="opt-bar">
        <div class="opt">
          <label for="opt-count">Records</label>
          <select id="opt-count">
            <option value="1" selected>1</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="100">100</option>
          </select>
        </div>
        <div class="opt">
          <label for="opt-seed">Seed</label>
          <input type="text" id="opt-seed" value="jsonstudio" style="min-width:120px;">
        </div>
        <div class="opt">
          <label for="opt-arr">Array size</label>
          <select id="opt-arr">
            <option value="1">1</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-optional" checked>
          <label for="opt-optional" style="cursor:pointer;">Include optional fields</label>
        </div>
      </div>
    </div>
  </div>
  <div class="convert-grid">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">JSON Schema</div>
        <button id="btn-sample">Load sample</button>
        <button id="btn-upload">Upload</button>
        <button id="btn-clear">Clear</button>
        <input type="file" id="file-input" accept=".json,application/json" style="display:none;">
      </div>
      <div class="pane-body">
        <textarea id="input" class="code-area" spellcheck="false" placeholder="{ "type": "object", "properties": {} }"></textarea>
      </div>
      <div class="pane-status" id="in-status">Waiting for input.</div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">Mock data</div>
        <button class="primary" id="btn-run">Generate</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
      <div class="pane-body">
        <textarea id="output" class="code-area" spellcheck="false" readonly placeholder="Generated records appear here."></textarea>
        <p class="note">Respects enum, const, formats, numeric and length bounds, required vs optional, and $ref to local pointers.</p>
      </div>
      <div class="pane-status" id="out-status"></div>
    </section>
  </div>
</main>
