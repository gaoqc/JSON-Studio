        { "@type": "Question", "name": "Does key order count as a difference?", "acceptedAnswer": { "@type": "Answer", "text": "No. Two objects with the same keys and values are identical regardless of the order they were written in, which is what the JSON specification says and what a text diff gets wrong." } },
        { "@type": "Question", "name": "What is the difference between JSON Patch and Merge Patch?", "acceptedAnswer": { "@type": "Answer", "text": "JSON Patch (RFC 6902) is a list of add/remove/replace operations with pointers — precise, and able to target array elements. Merge Patch (RFC 7386) is a partial document where null means \"delete this key\" — simpler, but it replaces arrays wholesale." } },
        { "@type": "Question", "name": "Can I compare two API responses?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, and it is the common case: paste yesterday's response and today's to see exactly what a deployment changed." } }

<body>

<div id="site-header"></div>
<span id="top"></span>

<main class="convert-shell">
  <div class="convert-head">
    <div class="container tool-topbar">
      <h1>JSON diff</h1>
      <p class="tt-sub">Structural, path-by-path comparison of two payloads — key order ignored.</p>
    </div>
    <div class="container">
      <div class="opt-bar">
        <div class="opt">
          <label for="opt-view">Output</label>
          <select id="opt-view">
            <option value="paths" selected>Change list</option>
            <option value="patch">JSON Patch (RFC 6902)</option>
            <option value="merge">Merge Patch (RFC 7386)</option>
          </select>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-arr-index" checked>
          <label for="opt-arr-index" style="cursor:pointer;">Compare arrays by index</label>
        </div>
      </div>
    </div>
  </div>
  <div class="convert-grid three">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">Original (A)</div>
        <button id="btn-sample">Load sample</button>
        <button id="btn-clear">Clear</button>
      </div>
      <div class="pane-body">
        <textarea id="input-a" class="code-area" spellcheck="false" placeholder="{ "before": true }"></textarea>
      </div>
      <div class="pane-status" id="a-status">Waiting for input.</div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">Changed (B)</div>
        <button id="btn-swap">Swap A ⇄ B</button>
      </div>
      <div class="pane-body">
        <textarea id="input-b" class="code-area" spellcheck="false" placeholder="{ "after": true }"></textarea>
      </div>
      <div class="pane-status" id="b-status"></div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">Differences</div>
        <button class="primary" id="btn-run">Compare</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
      <div class="pane-body">
        <textarea id="output" class="code-area" spellcheck="false" readonly placeholder="Differences appear here."></textarea>
        
      </div>
      <div class="pane-status" id="out-status"></div>
    </section>
  </div>
</main>
