<body>

<div id="site-header"></div>
<span id="top"></span>

<main class="convert-shell">
  <div class="convert-head">
    <div class="container tool-topbar">
      <h1>JSON formatter &amp; validator</h1>
      <p class="tt-sub">Beautify, minify, sort, escape — with errors pinned to line and column.</p>
    </div>
    <div class="container">
      <div class="opt-bar">
        <div class="opt">
          <label for="opt-mode">Mode</label>
          <select id="opt-mode">
            <option value="beautify" selected>Beautify</option>
            <option value="minify">Minify</option>
            <option value="escape">Escape to string</option>
            <option value="unescape">Unescape from string</option>
          </select>
        </div>
        <div class="opt">
          <label for="opt-indent">Indent</label>
          <select id="opt-indent">
            <option value="2" selected>2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-sort">
          <label for="opt-sort" style="cursor:pointer;">Sort keys</label>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-relaxed">
          <label for="opt-relaxed" style="cursor:pointer;">Accept JSON5-ish input</label>
        </div>
      </div>
    </div>
  </div>
  <div class="convert-grid">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">JSON input</div>
        <button id="btn-sample">Load sample</button>
        <button id="btn-upload">Upload</button>
        <button id="btn-clear">Clear</button>
        <input type="file" id="file-input" accept=".json,.txt,application/json" style="display:none;">
      </div>
      <div class="pane-body">
        <textarea id="input" class="code-area" spellcheck="false" placeholder="{&quot;paste your JSON here&quot;: true}"></textarea>
      </div>
      <div class="pane-status" id="in-status">Waiting for input.</div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title">Result</div>
        <button class="primary" id="btn-run">Format</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
      <div class="pane-body">
        <textarea id="output" class="code-area" spellcheck="false" readonly placeholder="Formatted output appears here."></textarea>
        <p class="note">Relaxed mode tolerates trailing commas, single quotes, unquoted keys and comments — handy for pasting config files.</p>
      </div>
      <div class="pane-status" id="out-status"></div>
    </section>
  </div>
</main>
