<body>

<div id="site-header"></div>
<span id="top"></span>

<main class="convert-shell">
  <div class="convert-head">
    <div class="container tool-topbar">
      <h1>JSONL ⇄ JSON</h1>
      <p class="tt-sub">NDJSON logs and LLM datasets to a JSON array, and back again.</p>
    </div>
    <div class="container">
      <div class="opt-bar">
        <div class="opt">
          <label>Direction</label>
          <div class="dir-pill" id="dir-pill">
            <button type="button" data-dir="auto" class="on">Auto</button>
            <button type="button" data-dir="l2j">JSONL → JSON</button>
            <button type="button" data-dir="j2l">JSON → JSONL</button>
          </div>
        </div>
        <div class="opt-sep"></div>
        <div class="opt">
          <input type="checkbox" id="opt-pretty" checked>
          <label for="opt-pretty" style="cursor:pointer;">Pretty-print array</label>
        </div>
        <div class="opt">
          <input type="checkbox" id="opt-skip">
          <label for="opt-skip" style="cursor:pointer;">Skip invalid lines</label>
        </div>
      </div>
    </div>
  </div>
  <div class="convert-grid">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title"><span id="in-label">Input</span></div>
        <button id="btn-sample-jsonl">Sample JSONL</button>
        <button id="btn-sample-json">Sample JSON</button>
        <button id="btn-upload">Upload</button>
        <button id="btn-clear">Clear</button>
        <input type="file" id="file-input" accept=".jsonl,.ndjson,.json,.txt" style="display:none;">
      </div>
      <div class="pane-body">
        <textarea id="input" class="code-area" spellcheck="false" placeholder="Paste JSONL (one object per line) or a JSON array."></textarea>
      </div>
      <div class="pane-status" id="in-status">Waiting for input.</div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title"><span id="out-label">Output</span></div>
        <button class="primary" id="btn-run">Convert</button>
        <button id="btn-swap">Use as input ⇄</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
      <div class="pane-body">
        <textarea id="output" class="code-area" spellcheck="false" readonly placeholder="Converted output appears here."></textarea>
        
      </div>
      <div class="pane-status" id="out-status"></div>
    </section>
  </div>
</main>
