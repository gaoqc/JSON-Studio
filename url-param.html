<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Params ⇄ JSON | JSON Studio</title>
<meta name="description" content="Convert URL query parameters to JSON and JSON objects back to URL parameters in your browser.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://jsonstudio.msdevbuild.com/url-param.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0078d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JSON Studio">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/convert.css">
<link rel="stylesheet" href="assets/css/present.css">
<link rel="stylesheet" href="assets/css/workbench.css">
<link rel="stylesheet" href="assets/css/tool-focus.css">
<link rel="stylesheet" href="assets/css/editor.css">
<script>(function(){try{var t=localStorage.getItem('json-studio-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>

<div id="site-header"></div>
<span id="top"></span>

<main class="convert-shell">
  <div class="convert-head">
    <div class="container tool-topbar">
      <h1>URL params ⇄ JSON</h1>
      <p class="tt-sub">Convert query strings like <code>id=1001&amp;name=zhangsan</code> into JSON and back.</p>
    </div>
    <div class="container">
      <div class="opt-bar">
        <div class="opt">
          <label>Direction</label>
          <div class="dir-pill" id="dir-pill">
            <button type="button" data-dir="auto" class="on">Auto</button>
            <button type="button" data-dir="p2j">Params → JSON</button>
            <button type="button" data-dir="j2p">JSON → Params</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="convert-grid">
    <section class="pane">
      <div class="pane-head">
        <div class="pane-title"><span id="in-label">Input</span></div>
        <button id="btn-sample-params">Sample params</button>
        <button id="btn-sample-json">Sample JSON</button>
        <button id="btn-upload">Upload</button>
        <button id="btn-clear">Clear</button>
        <input type="file" id="file-input" accept=".json,.txt" style="display:none;">
      </div>
      <div class="pane-body">
        <textarea id="input" class="code-area" spellcheck="false" placeholder="id=1001&name=zhangsan&age=25"></textarea>
      </div>
      <div class="pane-status" id="in-status">Waiting for input.</div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <div class="pane-title"><span id="out-label">Output</span></div>
        <button class="primary" id="btn-run">Convert</button>
        <button id="btn-swap">Use as input ⇄</button>
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
      <div class="pane-body">
        <textarea id="output" class="code-area" spellcheck="false" readonly placeholder="Converted output appears here."></textarea>
        <p class="note">Duplicate URL keys become arrays in JSON. Object and array values become JSON strings when converting back to params.</p>
      </div>
      <div class="pane-status" id="out-status"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/site.js"></script>
<script src="assets/js/payload-link.js"></script>
<script src="assets/js/tool-kit.js"></script>
<script src="assets/js/url-param.js"></script>
<script src="assets/js/present.js"></script>
<script src="assets/js/workbench.js"></script>
<script src="assets/js/history.js"></script>
<script src="assets/js/gutter.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/share.js"></script>
</body>
</html>
