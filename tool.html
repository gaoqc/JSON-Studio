<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSON Viewer & Diagram — visualise JSON as a tree, export PNG/SVG | JSON Studio</title>
<meta name="description" content="Free online JSON viewer that turns any payload into an interactive, collapsible diagram. Search keys and values, collapse branches, export as PNG or SVG. Client-side only — nothing is uploaded.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://jsonstudio.msdevbuild.com/tool.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0078d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JSON Studio">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="JSON Viewer & Diagram — visualise JSON as a tree, export PNG/SVG">
<meta property="og:description" content="Free online JSON viewer that turns any payload into an interactive, collapsible diagram. Search keys and values, collapse branches, export as PNG or SVG. Client-side only — nothing is uploaded.">
<meta property="og:url" content="https://jsonstudio.msdevbuild.com/tool.html">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/tool.css">
<link rel="stylesheet" href="assets/css/present.css">
<link rel="stylesheet" href="assets/css/workbench.css">
<link rel="stylesheet" href="assets/css/tool-focus.css">
<link rel="stylesheet" href="assets/css/editor.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>(function(){try{var t=localStorage.getItem('json-studio-theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "JSON Studio", "item": "https://jsonstudio.msdevbuild.com/" },
        { "@type": "ListItem", "position": 2, "name": "Tools", "item": "https://jsonstudio.msdevbuild.com/tools.html" },
        { "@type": "ListItem", "position": 3, "name": "JSON to diagram", "item": "https://jsonstudio.msdevbuild.com/tool.html" }
      ]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "Can I use this to present JSON in a meeting?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — that is what presentation mode is for. Press Present (or Shift+P) and the diagram takes the whole screen, with a presenter toolbar for zoom, fit, panning and a laser pointer." } },
        { "@type": "Question", "name": "What do the export formats give me?", "acceptedAnswer": { "@type": "Answer", "text": "SVG is vector, so it stays sharp in slides and print at any size. PNG is a raster image at screen resolution, handy for chat and tickets." } },
        { "@type": "Question", "name": "Is there a size limit for the diagram?", "acceptedAnswer": { "@type": "Answer", "text": "Very large documents produce very large trees. A few thousand nodes render comfortably; beyond that, collapse branches first or narrow the payload with the JSONPath tester." } }
      ]
    },
    {
      "@type": "HowTo",
      "name": "How to use the JSON to diagram",
      "step": [
        { "@type": "HowToStep", "position": 1, "text": "Paste JSON, upload a file, or load the sample." },
        { "@type": "HowToStep", "position": 2, "text": "Click Render, then collapse or expand branches to explore. Search highlights matches and opens the branches that contain them." },
        { "@type": "HowToStep", "position": 3, "text": "Export the diagram as PNG or SVG, or press Present to show it full screen." }
      ]
    }
  ]
}
</script>
</head>
<body>

<div id="site-header"></div>
<span id="top"></span>

<div class="tool-topbar solo">
  <div class="container">
    <h1>JSON to diagram</h1>
    <p class="tt-sub">Lay a payload out as a node-link tree you can pan, zoom, collapse and search.</p>
  </div>
</div>
<main class="tool-shell">
  <div class="tool-left">
    <div class="tool-controls">
      <button class="primary" id="btn-render">Render diagram</button>
      <button id="btn-sample">Load sample</button>
      <button id="btn-upload">Upload file</button>
      <button id="btn-format">Format</button>
      <input type="file" id="file-input" accept=".json,application/json" style="display:none;">
    </div>

    <div class="tool-search">
      <input type="text" id="search-input" placeholder="Search keys or values…">
      <span id="search-count"></span>
    </div>

    <div class="editor-wrap">
      <div class="editor-label"><span>JSON input</span><span>⌘/Ctrl + Enter to render</span></div>
      <textarea id="editor" spellcheck="false" placeholder='{"paste your JSON here": true}'></textarea>
    </div>
    <div id="status">Waiting for input.</div>

    <div class="ai-panel">
      <div class="row">
        <label for="ai-key" style="min-width:110px;">OpenAI API key</label>
        <input type="password" id="ai-key" placeholder="sk-…" style="flex:1;">
      </div>
      <button id="btn-ai-explain">Explain this JSON with AI</button>
      <p class="hint">Your key stays in this browser and is sent only to api.openai.com.</p>
      <div id="ai-output"></div>
    </div>
  </div>

  <div class="tool-right">
    <div class="canvas-toolbar">
      <button id="btn-expand">Expand all</button>
      <button id="btn-collapse">Collapse all</button>
      <button id="btn-fit">Fit to screen</button>
      <button id="btn-export-svg">Export SVG</button>
      <button class="primary" id="btn-export-png">Export PNG</button>
    </div>
    <div id="empty-hint">
      <div class="glyph">{ }</div>
      <p>Your diagram will appear here</p>
    </div>
    <svg id="svg"><g id="canvas-g"></g></svg>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/site.js"></script>
<script src="assets/js/payload-link.js"></script>
<script src="assets/js/diagram.js"></script>
<script src="assets/js/export.js"></script>
<script src="assets/js/ai-assist.js"></script>
<script src="assets/js/present.js"></script>
<script src="assets/js/workbench.js"></script>
<script src="assets/js/history.js"></script>
<script src="assets/js/gutter.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/share.js"></script>
</body>
</html>
